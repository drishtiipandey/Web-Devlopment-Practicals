<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Experiment 2 - Links and Images</title>
</head>
<body>
  <h1 id="top">Hyperlinks and Images</h1>
 
  <h2>Links</h2>
  <ul>
    <li><a href="about.html">Internal link to the About page</a></li>
    <li><a href="#images">Jump to the Images section (same page)</a></li>
    <li><a href="https://www.wikipedia.org" target="_blank">External link to
        Wikipedia</a></li>
  </ul>
 
  <h2 id="images">Images</h2>
  <h3>Local image</h3>
  <img src="images/photo.jpg" alt="A local photograph" width="300">
  <h3>Online image</h3>
  <img src="https://picsum.photos/400/250" alt="A random online photograph">
  <h3>Image as a link</h3>
  <a href="https://www.w3schools.com" target="_blank">
    <img src="images/photo.jpg" alt="Click to visit W3Schools" width="150">
  </a>
 
  <p><a href="#top">Back to top</a></p>
</body>
</html>
